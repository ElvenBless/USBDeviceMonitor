name: Build, Test and Publish NuGet Package

on:
  push:
    branches: [ "Release" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "Release" ]
  workflow_dispatch:

env:
  PACKAGE_NAME: USBDeviceMonitor.Win
  PROJECT_PATH: Source/USBDeviceMonitor.Win/USBDeviceMonitor.Win.csproj
  TEST_PROJECT_PATH: Source/USBDeviceMonitor.Tests/USBDeviceMonitor.Tests.csproj

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Source/USBDeviceMonitor.sln

      - name: Build solution
        run: dotnet build Source/USBDeviceMonitor.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 30

  publish-github-packages:
    needs: build-and-test
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish to GitHub Packages
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key ${{ secrets.GITHUB_TOKEN }} `
              --source https://nuget.pkg.github.com/${{ github.repository_owner }} `
              --skip-duplicate
          }
        shell: pwsh

  publish-nuget-org:
    needs: build-and-test
    runs-on: windows-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Release'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish to NuGet.org
        run: |
          $packages = Get-ChildItem -Path ./artifacts -Filter *.nupkg
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key ${{ secrets.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
        shell: pwsh
        continue-on-error: true

  create-release:
    needs: [build-and-test, publish-github-packages]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.nupkg
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## USBDeviceMonitor.Win ${{ steps.get_version.outputs.VERSION }}

            NuGet package for USB device monitoring on Windows.

            ### Installation

            ```bash
            dotnet add package USBDeviceMonitor.Win --version ${{ steps.get_version.outputs.VERSION }}
            ```

            Or add to your `.csproj`:

            ```xml
            <PackageReference Include="USBDeviceMonitor.Win" Version="${{ steps.get_version.outputs.VERSION }}" />
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
